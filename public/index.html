<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You - 3D ASCII Bouquet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #e4e4e7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      position: fixed;
      top: 3.75rem;
      right: 1.25rem;
      width: 275px;
      max-height: calc(100vh - 5rem);
      overflow-y: auto;
      background: rgba(16, 16, 22, 0.84);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1rem;
      z-index: 10;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .panel.collapsed {
      transform: translateY(-8px);
      opacity: 0;
      pointer-events: none;
    }
    .toggle-btn {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 20;
      background: rgba(16, 16, 22, 0.88);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .toggle-btn:hover { border-color: rgba(255, 255, 255, 0.35); }
    h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a1a1aa;
      margin-bottom: 0.75rem;
    }
    .flower-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }
    .flower-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.3rem 0.45rem;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .flower-item:hover { background: rgba(255, 255, 255, 0.06); }
    input[type="checkbox"], input[type="color"] { accent-color: #f472b6; cursor: pointer; }
    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      font-size: 0.82rem;
    }
    input[type="text"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.82rem;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus { outline: none; border-color: #f472b6; }
    .btn-share {
      width: 100%;
      padding: 0.5rem;
      background: #f472b6;
      color: #09090b;
      font-weight: 700;
      font-family: inherit;
      font-size: 0.82rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-share:hover { background: #f9a8d4; }
    .note-display {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 5;
      max-width: 90vw;
    }
    .note-text {
      font-size: 1.05rem;
      color: #fce7f3;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      letter-spacing: 0.03em;
    }
    .hint {
      font-size: 0.72rem;
      color: #71717a;
      margin-top: 0.35rem;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <button class="toggle-btn" id="toggle-ui">Customize Bouquet</button>

  <div class="panel collapsed" id="control-panel">
    <h2>Pick Your Flowers</h2>
    <div class="flower-list" id="flower-list"></div>

    <div class="row">
      <span>Ribbon Color</span>
      <input type="color" id="ribbon-color" value="#f43f5e" />
    </div>

    <div class="row">
      <span>Outer Wrap</span>
      <input type="color" id="wrap-color" value="#b08968" />
    </div>

    <div class="row">
      <span>Inner Wrap</span>
      <input type="color" id="tissue-color" value="#ebe1d9" />
    </div>

    <input type="text" id="note-input" placeholder="Write a gift note..." maxlength="80" />
    <button class="btn-share" id="copy-link">Copy Shareable Link</button>
  </div>

  <div class="note-display">
    <div class="note-text" id="note-text"></div>
    <div class="hint">drag to rotate &middot; scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const FLOWER_TYPES = {
      rose: { label: 'Velvet Roses', color: '#fb365c', count: 5 },
      lily: { label: 'Stargazer Lilies', color: '#ff85b3', count: 4 },
      sunflower: { label: 'Sunflowers', color: '#facc15', count: 3 },
      tulip: { label: 'French Tulips', color: '#fb7185', count: 5 },
      eucalyptus: { label: 'Silver Eucalyptus', color: '#5eead4', count: 5 },
      daisy: { label: 'Daisies', color: '#f8fafc', count: 5 },
      peony: { label: 'Blush Peonies', color: '#f9a8d4', count: 3 },
      hydrangea: { label: 'Hydrangea', color: '#a5b4fc', count: 2 },
      lavender: { label: 'Lavender', color: '#a78bfa', count: 5 },
      gypsophila: { label: "Baby's Breath", color: '#e2e8f0', count: 4 }
    };

    const params = new URLSearchParams(window.location.search);
    const initialFlowers = params.get('flowers')
      ? params.get('flowers').split(',').filter(k => FLOWER_TYPES[k])
      : ['rose', 'lily', 'eucalyptus'];

    const hexOr = (v, fallback) => (/^#[0-9a-f]{6}$/i.test(v || '') ? v : fallback);
    // Default lining for links that predate the inner-wrap picker: the wrap color pushed mostly toward white
    const tissueFor = hex => new THREE.Color(hex).lerp(new THREE.Color(0xffffff), 0.75);
    const wrapHex = hexOr(new URLSearchParams(window.location.search).get('wrap'), '#b08968');

    const state = {
      selected: new Set(initialFlowers.length ? initialFlowers : ['rose']),
      ribbon: hexOr(params.get('ribbon'), '#f43f5e'),
      wrap: wrapHex,
      tissue: hexOr(params.get('tissue'), '#' + tissueFor(wrapHex).getHexString()),
      note: params.get('note') || 'A little bouquet that never wilts'
    };

    // Scene & Studio Lighting
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.4, 8.2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.3));

    const keyLight = new THREE.DirectionalLight(0xfff5f7, 2.3);
    keyLight.position.set(5, 9, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc7d2fe, 0.65);
    fillLight.position.set(-6, 2, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.4);
    rimLight.position.set(0, 6, -7);
    scene.add(rimLight);

    // Performance-optimized ASCII Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1);

    // ---- ASCII renderer with a cell budget ----
    // Every ASCII cell is a DOM node that gets rewritten each frame, so cost scales with window AREA,
    // not GPU power: a big or hi-res window means a huge grid and slow frames. Cap the cell count instead
    // of using a fixed density. Tune with ?cells=40000 in the URL (more = sharper, slower).
    const ramp = ' .:-=+*#%@';
    const container = document.getElementById('canvas-container');
    let maxCells = Number(params.get('cells')) || (window.innerWidth < 600 ? 9000 : 24000);
    let effect = null;

    function buildEffect() {
      const w = window.innerWidth, h = window.innerHeight;
      // AsciiEffect draws roughly w*h*res^2 / 2 cells (it samples every other pixel row)
      const res = Math.min(0.22, Math.max(0.06, Math.sqrt((2 * maxCells) / (w * h))));
      if (effect) effect.domElement.remove();
      effect = new AsciiEffect(renderer, ramp, { invert: true, color: true, resolution: res });
      effect.domElement.style.backgroundColor = '#09090b';
      effect.domElement.setAttribute('role', 'img');
      effect.domElement.setAttribute('aria-label', 'Rotating 3D bouquet of flowers drawn in ASCII characters');
      container.appendChild(effect.domElement);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      effect.setSize(w, h);
      // The GL canvas only needs ~2x the character grid (AsciiEffect downsamples it anyway)
      renderer.setSize(Math.ceil(w * res * 2), Math.ceil(h * res * 2), false);
    }

    // ---- GPU ASCII renderer (default; add ?dom=1 to the URL for the old DOM version) ----
    // The scene renders into a small offscreen target (2x2 pixels per character cell). A fullscreen shader
    // then picks one glyph per cell from a texture atlas by brightness and tints it with that cell's color.
    // Nothing in the DOM changes per frame, so far more cells (a much sharper picture) cost far less.
    const useDom = params.has('dom');
    const CELL_W = Number(params.get('cell')) || 4; // character cell width in CSS px (height = 2x). Smaller = sharper
    // Any characters work (the atlas sorts them by measured ink density). Try adding ▒▓█ or braille.
    const CHARSET = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

    function makeAtlas(gw, gh) {
      const font = 'bold 100px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace';
      const draw = (ctx, ch, x) => {
        ctx.font = font;
        const fs = (100 * gw) / ctx.measureText('M').width; // size the font so one glyph advance = one cell width
        ctx.font = font.replace('100px', fs + 'px');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.fillText(ch, x + gw / 2, gh / 2);
      };
      const scratch = document.createElement('canvas');
      scratch.width = gw; scratch.height = gh;
      const sctx = scratch.getContext('2d', { willReadFrequently: true });
      const glyphs = [...CHARSET].map(ch => {
        sctx.clearRect(0, 0, gw, gh);
        draw(sctx, ch, 0);
        const d = sctx.getImageData(0, 0, gw, gh).data;
        let ink = 0;
        for (let i = 3; i < d.length; i += 4) ink += d[i];
        return { ch, ink };
      }).sort((a, b) => a.ink - b.ink); // lightest (space) -> densest
      const canvas = document.createElement('canvas');
      canvas.width = gw * glyphs.length; canvas.height = gh;
      const actx = canvas.getContext('2d');
      actx.fillStyle = '#000';
      actx.fillRect(0, 0, canvas.width, canvas.height);
      glyphs.forEach((g, i) => draw(actx, g.ch, i * gw));
      const tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      return { tex, count: glyphs.length };
    }

    const quadScene = new THREE.Scene();
    const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quadMat = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: null }, tAtlas: { value: null },
        uCells: { value: new THREE.Vector2(1, 1) }, uCount: { value: 1 }, uGamma: { value: 0.9 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: `
        uniform sampler2D tScene;
        uniform sampler2D tAtlas;
        uniform vec2 uCells;
        uniform float uCount;
        uniform float uGamma;
        varying vec2 vUv;
        void main() {
          vec2 g = vUv * uCells;
          vec2 cell = floor(g);
          vec2 local = fract(g);
          // Bilinear sample at the cell centre = exact average of the 2x2 scene pixels under this cell
          vec3 col = texture2D(tScene, (cell + 0.5) / uCells).rgb;
          col = pow(col, vec3(1.0 / 2.2));                 // linear -> display gamma
          float lum = dot(col, vec3(0.299, 0.587, 0.114));
          float idx = floor(clamp(pow(lum, uGamma), 0.0, 0.999) * uCount);
          float m = texture2D(tAtlas, vec2((idx + local.x) / uCount, local.y)).r;
          float mx = max(max(col.r, col.g), col.b);
          vec3 tint = mix(col, col / max(mx, 0.05), 0.6);  // keep hue, lift brightness; density carries the shading
          vec3 bg = vec3(0.035, 0.035, 0.043);
          gl_FragColor = vec4(mix(bg, tint, m), 1.0);
        }`,
      depthTest: false,
      depthWrite: false
    });
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat);
    quad.frustumCulled = false;
    quadScene.add(quad);

    let sceneRT = null, atlasTex = null;
    function buildGPU() {
      const w = window.innerWidth, h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cols = Math.max(1, Math.floor(w / CELL_W));
      const rows = Math.max(1, Math.floor(h / (CELL_W * 2)));
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h);
      if (!renderer.domElement.parentNode) {
        renderer.domElement.style.display = 'block';
        renderer.domElement.setAttribute('role', 'img');
        renderer.domElement.setAttribute('aria-label', 'Rotating 3D bouquet of flowers drawn in ASCII characters');
        container.appendChild(renderer.domElement);
      }
      if (sceneRT) sceneRT.dispose();
      sceneRT = new THREE.WebGLRenderTarget(cols * 2, rows * 2, { samples: 4, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
      if (atlasTex) atlasTex.dispose();
      const gw = Math.max(8, Math.round(CELL_W * dpr * 2)); // atlas glyphs at ~2x screen size, so bilinear smooths them
      const atlas = makeAtlas(gw, gw * 2);
      atlasTex = atlas.tex;
      quadMat.uniforms.tScene.value = sceneRT.texture;
      quadMat.uniforms.tAtlas.value = atlasTex;
      quadMat.uniforms.uCells.value.set(cols, rows);
      quadMat.uniforms.uCount.value = atlas.count;
      camera.aspect = w / h; // must match the screen, not the offscreen target
      camera.updateProjectionMatrix();
    }

    const buildView = () => (useDom ? buildEffect() : buildGPU());
    function renderFrame() {
      if (useDom) { effect.render(scene, camera); return; }
      renderer.setRenderTarget(sceneRT);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(quadScene, quadCam);
    }
    buildView();

    const controls = new OrbitControls(camera, container);
    controls.enableDamping = true;
    controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    controls.autoRotateSpeed = 1.4;
    controls.target.set(0, 0.35, 0);

    const bouquetGroup = new THREE.Group();
    scene.add(bouquetGroup);

    // Helper: create a curved, cupped petal mesh
    function createCurvedPetal(width, length, cupDepth, curlBack) {
      const geom = new THREE.PlaneGeometry(width, length, 5, 8);
      geom.translate(0, length * 0.5, 0);
      const pos = geom.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const u = x / (width * 0.5);
        const v = y / length;

        const widthProfile = Math.sin(Math.pow(v, 0.72) * Math.PI);
        pos.setX(i, x * widthProfile);

        const cup = (1 - u * u) * Math.sin(v * Math.PI) * cupDepth;
        const arch = Math.pow(v, 1.8) * curlBack;
        pos.setZ(i, cup - arch);
      }
      geom.computeVertexNormals();
      return geom;
    }

    // Helper: curved botanical leaf
    function createBotanicalLeaf(width, length) {
      const geom = new THREE.PlaneGeometry(width, length, 4, 7);
      geom.translate(0, length * 0.5, 0);
      const pos = geom.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const u = Math.abs(x / (width * 0.5));
        const v = y / length;
        const profile = Math.sin(Math.pow(v, 0.65) * Math.PI);
        pos.setX(i, x * profile);
        const vFold = u * 0.08;
        const droop = Math.pow(v, 2.1) * 0.35;
        pos.setZ(i, vFold - droop);
      }
      geom.computeVertexNormals();
      return geom;
    }

    // ---- Shared helpers for the flower models ----
    const KEEP = new Set(); // shared geometry/materials that must survive bouquet rebuilds
    const keep = o => (KEEP.add(o), o);
    const makeMat = (color, o = {}) => keep(new THREE.MeshStandardMaterial({ color, roughness: 0.5, side: THREE.DoubleSide, ...o }));
    const vcMat = (o = {}) => makeMat(0xffffff, { vertexColors: true, ...o }); // material that uses per-vertex colours

    // Generic petal. cup = belly, curl > 0 wraps the tip inward (< 0 rolls it outward), tipRound = outline exponent
    // (~0.4 blunt ... 1 pointed), ripple = wavy edge, peak < 1 pushes the widest point toward the tip,
    // colorFn(u, v, color) optionally writes per-vertex colours.
    function createPetalGeom(width, length, cup, curl, tipRound = 0.5, ripple = 0, peak = 0.8, colorFn = null) {
      const geom = new THREE.PlaneGeometry(width, length, 8, 14);
      geom.translate(0, length * 0.5, 0);
      const pos = geom.attributes.position;
      const colors = colorFn ? new Float32Array(pos.count * 3) : null;
      const c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), u = x / (width * 0.5), v = pos.getY(i) / length;
        pos.setX(i, x * Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(v, peak))), tipRound));
        pos.setZ(i, (1 - u * u) * Math.pow(Math.sin(v * Math.PI), 0.7) * cup - Math.pow(v, 2) * curl + Math.sin(v * 14) * ripple * u * u);
        if (colorFn) { colorFn(u, v, c); colors.set([c.r, c.g, c.b], i * 3); }
      }
      if (colors) geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geom.computeVertexNormals();
      return geom;
    }

    // A petal as a curved shell wrapped around the bloom's axis (+Y). span = angle it covers, R0/R1 = base/top radius,
    // bulge = belly, rim = how far the top edge rolls outward, frill = ruffle, c0 -> c1 = base -> rim colour.
    // Several overlapping shells read as a cupped rose or a fluffy peony.
    function createShellPetal({ R0, R1, h, span, bulge = 0.1, rim = 0, frill = 0, c0, c1 }) {
      const geom = new THREE.PlaneGeometry(1, 1, 10, 14);
      const pos = geom.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const a = new THREE.Color(c0), b = new THREE.Color(c1), c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const s = pos.getX(i) * 2, t = pos.getY(i) + 0.5; // s: -1..1 across, t: 0..1 up
        const roll = Math.pow(Math.max(0, (t - 0.7) / 0.3), 2);
        const r = R0 + (R1 - R0) * t + bulge * Math.sin(Math.PI * t) + rim * roll + frill * Math.sin(s * 6 + t * 4) * t * t;
        const y = h * t * (1 - 0.3 * s * s) - rim * 0.6 * roll + frill * 0.7 * Math.cos(s * 5) * t * t;
        const th = s * span * 0.5;
        pos.setXYZ(i, Math.sin(th) * r, y, Math.cos(th) * r);
        c.copy(a).lerp(b, Math.pow(t, 2.5));
        colors.set([c.r, c.g, c.b], i * 3);
      }
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geom.computeVertexNormals();
      return geom;
    }

    // Bake many (geometry, matrix, colour) parts into ONE BufferGeometry so a whole cluster is a single mesh
    function bakeParts(parts) {
      const pos = [], col = [];
      const v = new THREE.Vector3(), c = new THREE.Color();
      for (const { geom, matrix, color } of parts) {
        const g = geom.index ? geom.toNonIndexed() : geom;
        const p = g.attributes.position;
        c.set(color);
        for (let i = 0; i < p.count; i++) {
          v.fromBufferAttribute(p, i).applyMatrix4(matrix);
          pos.push(v.x, v.y, v.z);
          col.push(c.r, c.g, c.b);
        }
      }
      const out = new THREE.BufferGeometry();
      out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      out.computeVertexNormals();
      return out;
    }

    // Domed seed head: n tiny seeds on a golden-angle spiral, colour ramp from centre to rim
    function bakeDisc(radius, n, seedR, ramp, dome) {
      const seed = new THREE.SphereGeometry(seedR, 5, 4).scale(1, 0.7, 1);
      const parts = [];
      for (let i = 0; i < n; i++) {
        const f = (i + 0.5) / n, r = radius * Math.sqrt(f), a = i * 2.39996;
        const y = dome * Math.sqrt(Math.max(0, 1 - Math.pow(r / (radius + 0.02), 2))) + 0.005;
        parts.push({
          geom: seed,
          matrix: new THREE.Matrix4().makeTranslation(Math.cos(a) * r, y, Math.sin(a) * r),
          color: ramp[Math.min(ramp.length - 1, Math.floor(f * ramp.length))]
        });
      }
      return bakeParts(parts);
    }

    const leafGeom = createBotanicalLeaf(0.45, 1.05);
    const stemMat = new THREE.MeshStandardMaterial({
      color: 0x22c55e,
      roughness: 0.55,
      side: THREE.DoubleSide
    });

    function createStem(height, tipPos) {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(tipPos.x * -0.15, -2.3, tipPos.z * -0.15),
        new THREE.Vector3(0, -1.35, 0),
        new THREE.Vector3(tipPos.x * 0.45, height * 0.35, tipPos.z * 0.45),
        new THREE.Vector3(tipPos.x, height, tipPos.z)
      ]);
      const geom = new THREE.TubeGeometry(curve, 12, 0.038, 6, false);
      const mesh = new THREE.Mesh(geom, stemMat);

      for (let s = 0; s < 2; s++) {
        const t = 0.58 + s * 0.14;
        const pt = curve.getPoint(t);
        const leaf = new THREE.Mesh(leafGeom, stemMat);
        leaf.position.copy(pt);
        leaf.rotation.y = s * Math.PI + Math.atan2(tipPos.x, tipPos.z);
        leaf.rotation.x = 0.75;
        mesh.add(leaf);
      }
      return mesh;
    }

    // 1. Velvet rose: overlapping cupped shells (tight bud in the middle, outer petals rolling back at the rim)
    const roseLayers = [

    // 2. Stargazer Lily
    // Lily tepal modelled on a real Oriental lily: broad oval outline with a blunt, rounded tip, wavy edges,
    // a green-white throat fading to blush with a pink stripe up the middle, and a tip that curls back (`flare`).
    function createLilyPetal(width, length, cupDepth, flare) {
      const geom = new THREE.PlaneGeometry(width, length, 8, 22);
      geom.translate(0, length * 0.5, 0);
      const pos = geom.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const throat = new THREE.Color(0xc8e6a0), blush = new THREE.Color(0xfff1f6), rib = new THREE.Color(0xf472b6);
      const c = new THREE.Color();

        const x = pos.getX(i);
        const u = x / (width * 0.5);
        const v = pos.getY(i) / length;
        // sin(...)^0.55 keeps the tip blunt and rounded (a plain sin gives a sharp spike)
        const widthProfile = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(v, 0.9))), 0.55);
        pos.setX(i, x * widthProfile);
        const ripple = Math.sin(v * 16) * 0.04 * u * u; // wavy edges
        pos.setZ(i, (1 - u * u) * Math.pow(Math.sin(v * Math.PI), 0.7) * cupDepth + Math.pow(v, 2.4) * flare + ripple);
        const stripe = Math.pow(1 - Math.abs(u), 2) * Math.min(1, Math.max(0, (v - 0.15) / 0.5)) * 0.75;
        c.copy(throat).lerp(blush, Math.min(1, v / 0.3)).lerp(rib, stripe);
        colors.set([c.r, c.g, c.b], i * 3);

      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geom.computeVertexNormals();
      return geom;

    const lilyPetalGeom = createLilyPetal(0.4, 1.1, 0.1, 0.5);
    function createLilyHead() {
      const head = new THREE.Group();
      const petalMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        vertexColors: true,
        emissive: 0x2a0518,
        roughness: 0.4,
        side: THREE.DoubleSide

      for (let i = 0; i < 6; i++) {

        pivot.rotation.y = (i / 6) * Math.PI * 2;

        petal.rotation.x = 0.62 + (i % 2) * 0.1; // open star, but not flat
        pivot.add(petal);
        head.add(pivot);

      const filMat = new THREE.MeshStandardMaterial({ color: 0xd9f99d, roughness: 0.6 });
      const antherMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.8 });
      const filamentGeom = new THREE.CylinderGeometry(0.012, 0.016, 0.7, 5);
      filamentGeom.translate(0, 0.35, 0);
      const antherGeom = new THREE.SphereGeometry(0.04, 6, 5);
      antherGeom.scale(0.6, 2.4, 0.6);
      for (let i = 0; i < 6; i++) {
        const fil = new THREE.Mesh(filamentGeom, filMat);
        fil.rotation.z = 0.3 + (i % 2) * 0.18; // lean outward (applied before the spin below)
        fil.rotation.y = (i / 6) * Math.PI * 2 + 0.5;
        const anther = new THREE.Mesh(antherGeom, antherMat);
        anther.position.y = 0.72;
        fil.add(anther);
        head.add(fil);
      }
      const style = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.02, 0.9, 5).translate(0, 0.45, 0), filMat);
      style.rotation.z = 0.12;
      const stigma = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), new THREE.MeshStandardMaterial({ color: 0xe7f5d0 }));
      stigma.position.y = 0.92;
      style.add(stigma);
      head.add(style);

    }

    // 3. Sunflower: spiral seed head (brown centre, golden ring), bright pointed rays in two layers, green bracts behind
    const sunLo = new THREE.Color(0xf59e0b), sunHi = new THREE.Color(0xfde047);

    // 4. Tulip: smooth goblet of six tepals that wrap the axis. They are wide at the base and pointed at the tip,
    // so the 3 outer ones overlap the seams of the 3 inner ones and the inner ones show between the tips.
    function createTulipTepal(outer) {
      const geom = new THREE.PlaneGeometry(1, 1, 10, 16);
      const pos = geom.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const lo = new THREE.Color(0xfda4af), hi = new THREE.Color(outer ? 0xe11d48 : 0xf43f5e), c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const s = pos.getX(i) * 2, t = pos.getY(i) + 0.5;
        const half = 1.25 * Math.pow(1 - Math.pow(t, 3), 0.55); // angular half-width: wide base, pointed tip
        const flick = outer ? 0.1 * Math.pow(Math.max(0, (t - 0.85) / 0.15), 2) : 0; // outer tips flick outward
        const r = (0.08 + 0.3 * Math.sin(Math.PI * Math.pow(t, 0.85)) + 0.1 * t * t + 0.025 * (1 - s * s)) * (outer ? 1 : 0.93) + flick;
        const th = s * half;
        pos.setXYZ(i, Math.sin(th) * r, t, Math.cos(th) * r);
        c.copy(lo).lerp(hi, Math.min(1, t * 1.6)).lerp(lo, Math.pow(Math.abs(s), 4) * 0.45); // paler edges
        colors.set([c.r, c.g, c.b], i * 3);

      geom.computeVertexNormals();
      return geom;
    }
    const tulipOuterGeom = keep(createTulipTepal(true));
    const tulipInnerGeom = keep(createTulipTepal(false));
    const tulipMat = vcMat({ roughness: 0.28 });
    function createTulipHead() {
      const head = new THREE.Group();
      for (let k = 0; k < 3; k++) {
        const outer = new THREE.Group();
        outer.rotation.y = (k / 3) * Math.PI * 2;
        outer.add(new THREE.Mesh(tulipOuterGeom, tulipMat));
        const inner = new THREE.Group();
        inner.rotation.y = (k / 3) * Math.PI * 2 + Math.PI / 3;
        inner.add(new THREE.Mesh(tulipInnerGeom, tulipMat));
        head.add(outer, inner);
      }
      return faceOutward(head);
    }

    // 5. Silver Dollar Eucalyptus Sprig
    function createEucalyptusSprig(height, tipPos) {
      const group = new THREE.Group();
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(tipPos.x * -0.1, -2.3, tipPos.z * -0.1),
        new THREE.Vector3(0, -1.35, 0),
        new THREE.Vector3(tipPos.x * 0.55, height * 0.45, tipPos.z * 0.55),
        new THREE.Vector3(tipPos.x * 1.15, height + 0.35, tipPos.z * 1.15)
      ]);
      const eucMat = new THREE.MeshStandardMaterial({
        color: 0x5eead4,
        roughness: 0.6,
        side: THREE.DoubleSide
      });
      group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.025, 5, false), eucMat));

      const roundLeaf = new THREE.CylinderGeometry(0.22, 0.22, 0.02, 10);
      for (let i = 0; i < 9; i++) {
        const t = 0.42 + (i / 9) * 0.55;
        const pt = curve.getPoint(t);
        const side = i % 2 === 0 ? 1 : -1;
        const scale = 1.15 - (i / 9) * 0.55;
        const leaf = new THREE.Mesh(roundLeaf, eucMat);
        leaf.scale.set(scale, 1, scale * 0.9);
        leaf.position.set(pt.x + side * 0.14 * scale, pt.y, pt.z);
        leaf.rotation.set(0.35, i * 0.5, side * 0.45);

    }

    // ---- Extra flower types ----

    // Blooms are built facing +Y; this turns them to face +Z, the direction head.lookAt() aims (outward + up)
    function faceOutward(bloom) {
      const g = new THREE.Group();
      bloom.rotation.x = Math.PI / 2;
      g.add(bloom);

    }

    // 6. Daisy: one layer of broad strap petals (widest near the rounded tip) around a domed yellow disc
    const daisyPetal = keep(createPetalGeom(0.2, 0.64, 0.03, 0.04, 0.4, 0, 1.25));

          pivot.rotation.y = (i / L.n) * Math.PI * 2 + j * 0.7;

    // 8. Hydrangea: a round ball of four-petalled florets, baked into ONE mesh (mostly blue, lilac toward the bottom)
    const hydrangeaGeom = keep((() => {
      const petal = new THREE.CircleGeometry(0.085, 7).scale(1, 1.2, 1).translate(0, 0.075, 0);
      const blue = new THREE.Color(0x7c8cf8), pink = new THREE.Color(0xe9a6f0);
      const N = 90, zAxis = new THREE.Vector3(0, 0, 1), parts = [];
      for (let i = 0; i < N; i++) {

    // 9. Lavender: dense tapering spike of tubular florets in whorls (one baked mesh) sitting on top of a stem
    const lavSpikeGeom = keep((() => {
      const floret = new THREE.ConeGeometry(0.075, 0.24, 5).translate(0, 0.12, 0);

    // 10. Baby's breath: an airy cloud of tiny white blooms on a thin stem

    function createGypsophila(height, tip) {

    const HEADS = {
      rose: createRoseHead, lily: createLilyHead, sunflower: createSunflowerHead,

    // ---- Paper wrap (pleated kraft outside, tissue inside) + satin ribbon bow ----
    // Built once and added to the scene directly, so it isn't rebuilt when flowers change.
    const ribbonMat = new THREE.MeshStandardMaterial({ color: state.ribbon, roughness: 0.3, side: THREE.DoubleSide });
    const paperOuter = new THREE.MeshStandardMaterial({ color: state.wrap, roughness: 0.9, side: THREE.DoubleSide });
    const paperInner = new THREE.MeshStandardMaterial({ color: state.tissue, roughness: 0.85, side: THREE.DoubleSide });

    // Cone with sharp radial folds that deepen toward the open top, plus a ruffled rim.
    // (Old version: 28 segments for 14 pleats = 2 samples per fold, so the folds never showed.)
    function pleatedCone({ rTop, rBottom, height, pleats, depth, ruffle, ruffles }) {
      const g = new THREE.CylinderGeometry(rTop, rBottom, height, 144, 16, true);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const a = Math.atan2(z, x);
        const t = (y + height / 2) / height; // 0 = gathered bottom, 1 = open top
        const fold = Math.sin(a * pleats);
        const r = Math.hypot(x, z) + Math.sign(fold) * Math.pow(Math.abs(fold), 0.6) * depth * (0.2 + 0.8 * t);
        pos.setXYZ(i, Math.cos(a) * r, y + Math.cos(a * ruffles) * ruffle * t * t * t, Math.sin(a) * r);

      g.computeVertexNormals();
      return g;
    }

    // Ribbon tail: hangs down, hugs the cone, swallow-tail notch at the end
    const tailGeom = (() => {
      const g = new THREE.PlaneGeometry(0.22, 0.95, 1, 10);
      g.translate(0, -0.475, 0);
      const p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i);
        p.setZ(i, y * 0.5 + Math.sin(y * 7) * 0.025);
        if (y < -0.94) p.setY(i, y + (0.11 - Math.abs(x)) * 0.9);
      }
      g.computeVertexNormals();
      return g;
    })();

    function createPleatedWrap() {
      const g = new THREE.Group();
      const inner = new THREE.Mesh(pleatedCone({ rTop: 1.5, rBottom: 0.2, height: 2.6, pleats: 15, depth: 0.07, ruffle: 0.14, ruffles: 9 }), paperInner);
      inner.position.y = -0.85;
      const outer = new THREE.Mesh(pleatedCone({ rTop: 1.58, rBottom: 0.28, height: 2.3, pleats: 9, depth: 0.12, ruffle: 0.2, ruffles: 5 }), paperOuter);
      outer.position.y = -1.0;
      g.add(inner, outer);

      // The old ribbon (radius 0.36) was buried inside the paper (radius ~0.7 at that height).
      // This band sits just outside the paper surface, with the bow on the +Z side.
      const bandY = -1.3, R = 0.92, bz = R + 0.04;
      const band = new THREE.Mesh(new THREE.TorusGeometry(R, 0.06, 8, 48), ribbonMat);
      band.rotation.x = Math.PI / 2;
      band.position.y = bandY;
      band.scale.z = 2.2; // stretch along the ring axis => a wide flat ribbon
      g.add(band);

      const knot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), ribbonMat);
      knot.scale.set(1, 0.9, 0.8);
      knot.position.set(0, bandY + 0.02, bz + 0.02);
      g.add(knot);

      for (const d of [-1, 1]) {
        const loop = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.07, 8, 24), ribbonMat);
        loop.scale.set(1.25, 0.8, 0.7);
        loop.position.set(d * 0.33, bandY + 0.04, bz + 0.02);
        loop.rotation.set(0.1, d * 0.45, d * 0.3);
        g.add(loop);

        const tail = new THREE.Mesh(tailGeom, ribbonMat);
        tail.position.set(d * 0.07, bandY - 0.04, bz);
        tail.rotation.z = d * 0.2;
        g.add(tail);
      }
      return g;
    }
    scene.add(createPleatedWrap());

    // Deterministic PRNG: same selection => same bouquet, so a shared link looks identical for the recipient
    function mulberry32(a) {
      return () => {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Per-build geometry/materials are disposed on rebuild (prevents GPU memory leaks); these are reused
    [leafGeom, lilyPetalGeom, stemMat].forEach(o => KEEP.add(o));
    function clearBouquet() {
      bouquetGroup.traverse(o => {
        if (o.geometry && !KEEP.has(o.geometry)) o.geometry.dispose();
        if (o.material && !KEEP.has(o.material)) o.material.dispose();
      });
      bouquetGroup.clear();
    }

    function buildBouquet() {
      clearBouquet();
      const rand = mulberry32(2024);

      const items = [];
      state.selected.forEach(type => {
        const count = FLOWER_TYPES[type].count;
        for (let i = 0; i < count; i++) items.push(type);
      });

      items.forEach((type, idx) => {
        const total = items.length;
        const frac = (idx + 0.5) / total;
        const angle = idx * 2.39996;
        const spread = 0.22 + Math.sqrt(frac) * 1.45;
        const height = 1.2 - frac * 0.55 + (rand() - 0.5) * 0.16; // heads sit just above the paper rim

        const tipPos = new THREE.Vector3(
          Math.cos(angle) * spread,
          height,
          Math.sin(angle) * spread
        );

        if (FILLERS[type]) {
          bouquetGroup.add(FILLERS[type](height, tipPos));
          return;
        }

        bouquetGroup.add(createStem(height, tipPos));
        const head = HEADS[type]();

        head.position.copy(tipPos);
        head.lookAt(tipPos.x * 2.4, tipPos.y + 1.6, tipPos.z * 2.4);
        bouquetGroup.add(head);
      });

    }

    // Floating ASCII sparkles
    const sparkleGroup = new THREE.Group();
    scene.add(sparkleGroup);
    const sparkleMat = new THREE.MeshBasicMaterial({ color: 0xfbcfe8 });
    const sparkleGeom = new THREE.OctahedronGeometry(0.045, 0);
    const sparkles = [];
    for (let i = 0; i < 18; i++) {
      const s = new THREE.Mesh(sparkleGeom, sparkleMat);
      s.position.set(
        (Math.random() - 0.5) * 6.5,
        (Math.random() - 0.5) * 5.5,
        (Math.random() - 0.5) * 6.5
      );
      s.userData.speed = 0.004 + Math.random() * 0.005;
      sparkleGroup.add(s);
      sparkles.push(s);
    }

    // UI Controls
    const flowerListEl = document.getElementById('flower-list');
    Object.entries(FLOWER_TYPES).forEach(([key, info]) => {
      const label = document.createElement('label');
      label.className = 'flower-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = state.selected.has(key);
      cb.addEventListener('change', () => {
        if (cb.checked) state.selected.add(key);
        else if (state.selected.size > 1) state.selected.delete(key);
        else cb.checked = true;
        buildBouquet();
        syncURL();
      });

      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = info.color;

      label.append(cb, swatch, document.createTextNode(info.label));
      flowerListEl.appendChild(label);
    });

    const ribbonInput = document.getElementById('ribbon-color');
    ribbonInput.value = state.ribbon;
    ribbonInput.addEventListener('input', e => {
      state.ribbon = e.target.value;
      ribbonMat.color.set(state.ribbon);
      syncURL();
    });

    const wrapInput = document.getElementById('wrap-color');
    wrapInput.value = state.wrap;
    wrapInput.addEventListener('input', e => {
      state.wrap = e.target.value;
      paperOuter.color.set(state.wrap);
      syncURL();
    });

    const tissueInput = document.getElementById('tissue-color');
    tissueInput.value = state.tissue;
    tissueInput.addEventListener('input', e => {
      state.tissue = e.target.value;
      paperInner.color.set(state.tissue);
      syncURL();
    });

    const noteInput = document.getElementById('note-input');
    const noteText = document.getElementById('note-text');
    noteInput.value = state.note;
    noteText.textContent = state.note;
    noteInput.addEventListener('input', e => {
      state.note = e.target.value;
      noteText.textContent = state.note;
      syncURL();
    });

    function syncURL() {
      const url = new URL(window.location);
      url.searchParams.set('flowers', Array.from(state.selected).join(','));
      url.searchParams.set('ribbon', state.ribbon);
      url.searchParams.set('wrap', state.wrap);
      url.searchParams.set('tissue', state.tissue);
      if (state.note) url.searchParams.set('note', state.note);
      else url.searchParams.delete('note');
      try { window.history.replaceState({}, '', url); } catch { /* e.g. file:// — address bar just won't update */ }
    }

    const copyBtn = document.getElementById('copy-link');
    copyBtn.addEventListener('click', async () => {
      let label = 'Link Copied!';
      try {
        await navigator.clipboard.writeText(window.location.href);
      } catch {
        label = 'Copy from address bar'; // clipboard API needs HTTPS + permission
      }
      copyBtn.textContent = label;
      setTimeout(() => (copyBtn.textContent = 'Copy Shareable Link'), 1800);
    });

    const panel = document.getElementById('control-panel');
    const toggleBtn = document.getElementById('toggle-ui');
    toggleBtn.addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      toggleBtn.textContent = panel.classList.contains('collapsed') ? 'Customize Bouquet' : 'Close';
    });

    buildBouquet();
    syncURL();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildView, 120);
    });

    // Cap at ~30fps: the ASCII pass rewrites a large DOM table every frame, and ASCII doesn't need 60fps
    const FRAME_MS = 1000 / 30;
    let last = 0;
    let slow = 0;
    function animate(now = 0) {
      requestAnimationFrame(animate);
      const elapsed = now - last;
      if (elapsed < FRAME_MS - 2) return;
      last = now;
      const dt = Math.min(elapsed / 16.7, 3); // keeps sparkle speed independent of frame rate
      controls.update();
      sparkles.forEach(s => {
        s.position.y += s.userData.speed * dt;
        s.rotation.y += 0.02 * dt;
        if (s.position.y > 3.2) s.position.y = -2.6;
      });
      const t0 = performance.now();
      renderFrame();

      // Quality governor: if frames keep coming in slower than ~16fps (software WebGL, weak laptop,
      // huge monitor), shrink the ASCII grid by 30% and rebuild. Ignores long gaps from hidden tabs.
      const slowFrame = (elapsed > 60 && elapsed < 500) || performance.now() - t0 > 30;
      slow = slowFrame ? slow + 1 : Math.max(0, slow - 1);
      if (useDom && slow > 25 && maxCells > 3000) {
        maxCells = Math.max(3000, maxCells * 0.7);
        slow = 0;
        buildEffect();
      }
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
