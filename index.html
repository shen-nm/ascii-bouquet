<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You — 3D ASCII Bouquet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #e4e4e7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      position: fixed;
      top: 3.75rem;
      right: 1.25rem;
      width: 275px;
      max-height: calc(100vh - 5rem);
      overflow-y: auto;
      background: rgba(16, 16, 22, 0.84);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1rem;
      z-index: 10;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .panel.collapsed {
      transform: translateY(-8px);
      opacity: 0;
      pointer-events: none;
    }
    .toggle-btn {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 20;
      background: rgba(16, 16, 22, 0.88);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .toggle-btn:hover { border-color: rgba(255, 255, 255, 0.35); }
    h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a1a1aa;
      margin-bottom: 0.75rem;
    }
    .flower-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }
    .flower-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.3rem 0.45rem;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .flower-item:hover { background: rgba(255, 255, 255, 0.06); }
    input[type="checkbox"], input[type="color"] { accent-color: #f472b6; cursor: pointer; }
    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      font-size: 0.82rem;
    }
    input[type="text"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.82rem;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus { outline: none; border-color: #f472b6; }
    .btn-share {
      width: 100%;
      padding: 0.5rem;
      background: #f472b6;
      color: #09090b;
      font-weight: 700;
      font-family: inherit;
      font-size: 0.82rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-share:hover { background: #f9a8d4; }
    .note-display {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 5;
      max-width: 90vw;
    }
    .note-text {
      font-size: 1.05rem;
      color: #fce7f3;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      letter-spacing: 0.03em;
    }
    .hint {
      font-size: 0.72rem;
      color: #71717a;
      margin-top: 0.35rem;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <button class="toggle-btn" id="toggle-ui">Customize Bouquet</button>

  <div class="panel collapsed" id="control-panel">
    <h2>Pick Your Flowers</h2>
    <div class="flower-list" id="flower-list"></div>

    <div class="row">
      <span>Ribbon Color</span>
      <input type="color" id="ribbon-color" value="#f43f5e" />
    </div>

    <div class="row">
      <span>Outer Wrap</span>
      <input type="color" id="wrap-color" value="#b08968" />
    </div>

    <div class="row">
      <span>Inner Wrap</span>
      <input type="color" id="tissue-color" value="#ebe1d9" />
    </div>

    <input type="text" id="note-input" placeholder="Write a gift note..." maxlength="80" />
    <button class="btn-share" id="copy-link">Copy Shareable Link</button>
  </div>

  <div class="note-display">
    <div class="note-text" id="note-text"></div>
    <div class="hint">drag to rotate &middot; scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const FLOWER_TYPES = {
      rose: { label: 'Velvet Roses', color: '#fb365c', count: 5 },
      lily: { label: 'Stargazer Lilies', color: '#ff85b3', count: 4 },
      sunflower: { label: 'Sunflowers', color: '#facc15', count: 3 },
      tulip: { label: 'French Tulips', color: '#fb7185', count: 5 },
      eucalyptus: { label: 'Silver Eucalyptus', color: '#5eead4', count: 5 },
      daisy: { label: 'Daisies', color: '#f8fafc', count: 5 },
      peony: { label: 'Blush Peonies', color: '#f9a8d4', count: 3 },
      hydrangea: { label: 'Hydrangea', color: '#a5b4fc', count: 2 },
      lavender: { label: 'Lavender', color: '#a78bfa', count: 5 },
      gypsophila: { label: "Baby's Breath", color: '#e2e8f0', count: 4 }
    };

    const params = new URLSearchParams(window.location.search);
    const initialFlowers = params.get('flowers')
      ? params.get('flowers').split(',').filter(k => FLOWER_TYPES[k])
      : ['rose', 'lily', 'eucalyptus'];

    const hexOr = (v, fallback) => (/^#[0-9a-f]{6}$/i.test(v || '') ? v : fallback);
    // Default lining for links that predate the inner-wrap picker: the wrap color pushed mostly toward white
    const tissueFor = hex => new THREE.Color(hex).lerp(new THREE.Color(0xffffff), 0.75);
    const wrapHex = hexOr(new URLSearchParams(window.location.search).get('wrap'), '#b08968');

    const state = {
      selected: new Set(initialFlowers.length ? initialFlowers : ['rose']),
      ribbon: hexOr(params.get('ribbon'), '#f43f5e'),
      wrap: wrapHex,
      tissue: hexOr(params.get('tissue'), '#' + tissueFor(wrapHex).getHexString()),
      note: params.get('note') || 'A little bouquet that never wilts'
    };

    // Scene & Studio Lighting
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.4, 8.2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.3));

    const keyLight = new THREE.DirectionalLight(0xfff5f7, 2.3);
    keyLight.position.set(5, 9, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc7d2fe, 0.65);
    fillLight.position.set(-6, 2, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.4);
    rimLight.position.set(0, 6, -7);
    scene.add(rimLight);

    // Performance-optimized ASCII Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1);

    // ---- ASCII renderer with a cell budget ----
    // Every ASCII cell is a DOM node that gets rewritten each frame, so cost scales with window AREA,
    // not GPU power: a big or hi-res window means a huge grid and slow frames. Cap the cell count instead
    // of using a fixed density. Tune with ?cells=40000 in the URL (more = sharper, slower).
    const ramp = ' .:-=+*#%@';
    const container = document.getElementById('canvas-container');
    let maxCells = Number(params.get('cells')) || (window.innerWidth < 600 ? 9000 : 24000);
    let effect = null;

    function buildEffect() {
      const w = window.innerWidth, h = window.innerHeight;
      // AsciiEffect draws roughly w*h*res^2 / 2 cells (it samples every other pixel row)
      const res = Math.min(0.22, Math.max(0.06, Math.sqrt((2 * maxCells) / (w * h))));
      if (effect) effect.domElement.remove();
      effect = new AsciiEffect(renderer, ramp, { invert: true, color: true, resolution: res });
      effect.domElement.style.backgroundColor = '#09090b';
      effect.domElement.setAttribute('role', 'img');
      effect.domElement.setAttribute('aria-label', 'Rotating 3D bouquet of flowers drawn in ASCII characters');
      container.appendChild(effect.domElement);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      effect.setSize(w, h);
      // The GL canvas only needs ~2x the character grid (AsciiEffect downsamples it anyway)
      renderer.setSize(Math.ceil(w * res * 2), Math.ceil(h * res * 2), false);
    }
    buildEffect();

    const controls = new OrbitControls(camera, container);
    controls.enableDamping = true;
    controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    controls.autoRotateSpeed = 1.4;
    controls.target.set(0, 0.35, 0);

    const bouquetGroup = new THREE.Group();
    scene.add(bouquetGroup);

    // Helper: create a curved, cupped petal mesh
    function createCurvedPetal(width, length, cupDepth, curlBack) {
      const geom = new THREE.PlaneGeometry(width, length, 5, 8);
      geom.translate(0, length * 0.5, 0);
      const pos = geom.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const u = x / (width * 0.5);
        const v = y / length;

        const widthProfile = Math.sin(Math.pow(v, 0.72) * Math.PI);
        pos.setX(i, x * widthProfile);

        const cup = (1 - u * u) * Math.sin(v * Math.PI) * cupDepth;
        const arch = Math.pow(v, 1.8) * curlBack;
        pos.setZ(i, cup - arch);
      }
      geom.computeVertexNormals();
      return geom;
    }

    // Helper: curved botanical leaf
    function createBotanicalLeaf(width, length) {
      const geom = new THREE.PlaneGeometry(width, length, 4, 7);
      geom.translate(0, length * 0.5, 0);
      const pos = geom.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const u = Math.abs(x / (width * 0.5));
        const v = y / length;
        const profile = Math.sin(Math.pow(v, 0.65) * Math.PI);
        pos.setX(i, x * profile);
        const vFold = u * 0.08;
        const droop = Math.pow(v, 2.1) * 0.35;
        pos.setZ(i, vFold - droop);
      }
      geom.computeVertexNormals();
      return geom;
    }

    const leafGeom = createBotanicalLeaf(0.45, 1.05);
    const stemMat = new THREE.MeshStandardMaterial({
      color: 0x22c55e,
      roughness: 0.55,
      side: THREE.DoubleSide
    });

    function createStem(height, tipPos) {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(tipPos.x * -0.15, -2.3, tipPos.z * -0.15),
        new THREE.Vector3(0, -1.35, 0),
        new THREE.Vector3(tipPos.x * 0.45, height * 0.35, tipPos.z * 0.45),
        new THREE.Vector3(tipPos.x, height, tipPos.z)
      ]);
      const geom = new THREE.TubeGeometry(curve, 12, 0.038, 6, false);
      const mesh = new THREE.Mesh(geom, stemMat);

      for (let s = 0; s < 2; s++) {
        const t = 0.58 + s * 0.14;
        const pt = curve.getPoint(t);
        const leaf = new THREE.Mesh(leafGeom, stemMat);
        leaf.position.copy(pt);
        leaf.rotation.y = s * Math.PI + Math.atan2(tipPos.x, tipPos.z);
        leaf.rotation.x = 0.75;
        mesh.add(leaf);
      }
      return mesh;
    }

    // 1. Sculpted Velvet Rose
    const roseInnerPetal = createCurvedPetal(0.42, 0.55, 0.16, 0.05);
    const roseOuterPetal = createCurvedPetal(0.62, 0.72, 0.18, 0.24);
    function createRoseHead() {
      const head = new THREE.Group();
      const innerMat = new THREE.MeshStandardMaterial({
        color: 0xbe123c,
        roughness: 0.5,
        side: THREE.DoubleSide
      });
      const outerMat = new THREE.MeshStandardMaterial({
        color: 0xfb365c,
        roughness: 0.38,
        side: THREE.DoubleSide
      });

      const totalPetals = 16;
      for (let i = 0; i < totalPetals; i++) {
        const isOuter = i >= 7;
        const petal = new THREE.Mesh(
          isOuter ? roseOuterPetal : roseInnerPetal,
          isOuter ? outerMat : innerMat
        );
        const angle = i * 2.39996;
        const ring = i / totalPetals;
        petal.position.set(
          Math.cos(angle) * (0.03 + ring * 0.14),
          -ring * 0.06,
          Math.sin(angle) * (0.03 + ring * 0.14)
        );
        petal.rotation.y = -angle + Math.PI / 2;
        petal.rotation.x = 0.18 + ring * 0.72;
        head.add(petal);
      }
      return head;
    }

    // 2. Stargazer Lily
    const lilyPetalGeom = createCurvedPetal(0.48, 1.15, 0.12, 0.42);
    function createLilyHead() {
      const head = new THREE.Group();
      const petalMat = new THREE.MeshStandardMaterial({
        color: 0xff85b3,
        emissive: 0x3b0722,
        roughness: 0.35,
        side: THREE.DoubleSide
      });
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const petal = new THREE.Mesh(lilyPetalGeom, petalMat);
        petal.rotation.y = angle;
        petal.rotation.x = 0.85 + (i % 2) * 0.12;
        head.add(petal);
      }
      const stamenMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
      const filamentGeom = new THREE.CylinderGeometry(0.012, 0.012, 0.65, 5);
      filamentGeom.translate(0, 0.32, 0);
      const antherGeom = new THREE.SphereGeometry(0.045, 5, 4);
      antherGeom.scale(0.6, 1.6, 0.6);

      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        const fil = new THREE.Mesh(filamentGeom, stemMat);
        fil.rotation.z = 0.25;
        fil.rotation.y = a;
        const anther = new THREE.Mesh(antherGeom, stamenMat);
        anther.position.y = 0.65;
        fil.add(anther);
        head.add(fil);
      }
      return head;
    }

    // 3. Sunflower (fixed radial pivot so petals fan outward cleanly around the seed disc)
    const sunRayGeom = createCurvedPetal(0.24, 0.72, 0.04, 0.1);
    function createSunflowerHead() {
      const head = new THREE.Group();

      // Dark brown seed center
      const discMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });
      const discGeom = new THREE.SphereGeometry(0.44, 14, 10);
      discGeom.scale(1, 0.28, 1);
      head.add(new THREE.Mesh(discGeom, discMat));

      // Ring of golden florets around the disc rim
      const floretMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
      const floretGeom = new THREE.SphereGeometry(0.045, 5, 4);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const dot = new THREE.Mesh(floretGeom, floretMat);
        dot.position.set(Math.cos(a) * 0.38, 0.06, Math.sin(a) * 0.38);
        head.add(dot);
      }

      // Two staggered rings of yellow petals radiating outward in the XZ plane
      const rayMat = new THREE.MeshStandardMaterial({
        color: 0xfacc15,
        roughness: 0.4,
        side: THREE.DoubleSide
      });
      const rayCount = 22;
      for (let i = 0; i < rayCount; i++) {
        const angle = (i / rayCount) * Math.PI * 2;
        const pivot = new THREE.Group();
        pivot.rotation.y = angle;

        const ray = new THREE.Mesh(sunRayGeom, rayMat);
        ray.position.set(0, 0, 0.36);
        // Lay flat radially outward (+Z) with alternating slight tilt
        ray.rotation.x = Math.PI / 2 + (i % 2 === 0 ? -0.14 : 0.06);

        pivot.add(ray);
        head.add(pivot);
      }

      // Face the bloom outward (a plain rotation gets overwritten by lookAt in buildBouquet)
      return faceOutward(head);
    }

    // 4. French Tulip
    const tulipPetalGeom = createCurvedPetal(0.46, 0.88, 0.24, -0.08);
    function createTulipHead() {
      const head = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: 0xfb7185,
        roughness: 0.32,
        side: THREE.DoubleSide
      });
      for (let i = 0; i < 6; i++) {
        const isInner = i % 2 === 0;
        const angle = (i / 6) * Math.PI * 2;
        const petal = new THREE.Mesh(tulipPetalGeom, mat);
        const r = isInner ? 0.07 : 0.11;
        petal.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
        petal.rotation.y = -angle + Math.PI / 2;
        petal.rotation.x = isInner ? 0.06 : 0.16;
        head.add(petal);
      }
      return head;
    }

    // 5. Silver Dollar Eucalyptus Sprig
    function createEucalyptusSprig(height, tipPos) {
      const group = new THREE.Group();
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(tipPos.x * -0.1, -2.3, tipPos.z * -0.1),
        new THREE.Vector3(0, -1.35, 0),
        new THREE.Vector3(tipPos.x * 0.55, height * 0.45, tipPos.z * 0.55),
        new THREE.Vector3(tipPos.x * 1.15, height + 0.35, tipPos.z * 1.15)
      ]);
      const eucMat = new THREE.MeshStandardMaterial({
        color: 0x5eead4,
        roughness: 0.6,
        side: THREE.DoubleSide
      });
      group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.025, 5, false), eucMat));

      const roundLeaf = new THREE.CylinderGeometry(0.22, 0.22, 0.02, 10);
      for (let i = 0; i < 9; i++) {
        const t = 0.42 + (i / 9) * 0.55;
        const pt = curve.getPoint(t);
        const side = i % 2 === 0 ? 1 : -1;
        const scale = 1.15 - (i / 9) * 0.55;
        const leaf = new THREE.Mesh(roundLeaf, eucMat);
        leaf.scale.set(scale, 1, scale * 0.9);
        leaf.position.set(pt.x + side * 0.14 * scale, pt.y, pt.z);
        leaf.rotation.set(0.35, i * 0.5, side * 0.45);
        group.add(leaf);
      }
      return group;
    }

    // ---- Extra flower types ----
    const KEEP = new Set(); // shared geometry/materials that must survive bouquet rebuilds
    const keep = o => (KEEP.add(o), o);
    const makeMat = (color, o = {}) => keep(new THREE.MeshStandardMaterial({ color, roughness: 0.5, side: THREE.DoubleSide, ...o }));

    // Blooms are built facing +Y; this turns them to face +Z, the direction head.lookAt() aims (outward + up)
    function faceOutward(bloom) {
      const g = new THREE.Group();
      bloom.rotation.x = Math.PI / 2;
      g.add(bloom);
      return g;
    }

    // 6. Daisy
    const daisyPetal = keep(createCurvedPetal(0.13, 0.52, 0.02, 0.05));
    const daisyDisc = keep(new THREE.SphereGeometry(0.16, 10, 6).scale(1, 0.55, 1));
    const daisyWhite = makeMat(0xf8fafc, { roughness: 0.4 });
    const daisyEye = makeMat(0xfacc15);
    function createDaisyHead() {
      const bloom = new THREE.Group();
      bloom.add(new THREE.Mesh(daisyDisc, daisyEye));
      for (let i = 0; i < 18; i++) {
        const pivot = new THREE.Group();
        pivot.rotation.y = (i / 18) * Math.PI * 2;
        const p = new THREE.Mesh(daisyPetal, daisyWhite);
        p.position.z = 0.14;
        p.rotation.x = Math.PI / 2 - 0.12 + (i % 2) * 0.1;
        pivot.add(p);
        bloom.add(pivot);
      }
      return faceOutward(bloom);
    }

    // 7. Peony: four rings of ruffled petals, deep pink in the middle fading to pale outside
    const peonyPetal = keep(createCurvedPetal(0.5, 0.6, 0.2, 0.2));
    const peonyMats = [0xf472b6, 0xf9a8d4, 0xfbcfe8, 0xfce7f3].map(c => makeMat(c, { roughness: 0.45 }));
    function createPeonyHead() {
      const bloom = new THREE.Group();
      [[7, 0.15, 0.55], [9, 0.45, 0.72], [11, 0.75, 0.88], [13, 1.05, 1]].forEach(([n, tilt, size], layer) => {
        for (let i = 0; i < n; i++) {
          const pivot = new THREE.Group();
          pivot.rotation.y = (i / n) * Math.PI * 2 + layer * 0.5;
          const p = new THREE.Mesh(peonyPetal, peonyMats[layer]);
          p.scale.setScalar(size);
          p.position.set(0, -layer * 0.03, 0.04 + layer * 0.05);
          p.rotation.x = tilt;
          pivot.add(p);
          bloom.add(pivot);
        }
      });
      return faceOutward(bloom);
    }

    // 8. Hydrangea: a dome of small florets laid out on a golden-angle spiral
    const hydFloret = keep(new THREE.SphereGeometry(0.12, 6, 4).scale(1, 0.55, 1));
    const hydMats = [0x93c5fd, 0xa5b4fc, 0xc4b5fd].map(c => makeMat(c, { roughness: 0.6 }));
    function createHydrangeaHead() {
      const bloom = new THREE.Group(), N = 46;
      for (let i = 0; i < N; i++) {
        const cosT = 1 - (i + 0.5) / N, sinT = Math.sqrt(1 - cosT * cosT), a = i * 2.39996;
        const f = new THREE.Mesh(hydFloret, hydMats[i % 3]);
        f.position.set(Math.cos(a) * sinT * 0.5, cosT * 0.42, Math.sin(a) * sinT * 0.5);
        bloom.add(f);
      }
      return faceOutward(bloom);
    }

    // 9. Lavender: own stem, florets spiralling up the top third
    const lavFloret = keep(new THREE.SphereGeometry(0.055, 5, 4).scale(1, 1.5, 1));
    const lavMats = [0x8b5cf6, 0xa78bfa, 0xc4b5fd].map(c => makeMat(c));
    function createLavender(height, tip) {
      const g = new THREE.Group();
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(tip.x * -0.1, -2.3, tip.z * -0.1),
        new THREE.Vector3(0, -1.35, 0),
        new THREE.Vector3(tip.x * 0.5, height * 0.45, tip.z * 0.5),
        new THREE.Vector3(tip.x * 0.95, height + 0.55, tip.z * 0.95)
      ]);
      g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.022, 5, false), stemMat));
      for (let i = 0; i < 34; i++) {
        const pt = curve.getPoint(0.66 + (i / 34) * 0.34);
        const a = i * 2.39996, r = 0.07 * (1 - i / 60);
        const f = new THREE.Mesh(lavFloret, lavMats[i % 3]);
        f.position.set(pt.x + Math.cos(a) * r, pt.y, pt.z + Math.sin(a) * r);
        g.add(f);
      }
      return g;
    }

    // 10. Baby's breath: an airy cloud of tiny white blooms on a thin stem
    const gypDot = keep(new THREE.SphereGeometry(0.06, 5, 4));
    const gypMat = makeMat(0xf1f5f9, { roughness: 0.7 });
    function createGypsophila(height, tip) {
      const g = new THREE.Group();
      const top = new THREE.Vector3(tip.x * 1.05, height + 0.25, tip.z * 1.05);
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(tip.x * -0.1, -2.3, tip.z * -0.1),
        new THREE.Vector3(0, -1.35, 0),
        new THREE.Vector3(tip.x * 0.5, height * 0.45, tip.z * 0.5),
        top
      ]);
      g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.018, 5, false), stemMat));
      for (let i = 0; i < 28; i++) {
        const cosT = 1 - (2 * (i + 0.5)) / 28, sinT = Math.sqrt(1 - cosT * cosT), a = i * 2.39996;
        const r = 0.3 + 0.12 * Math.sin(i * 12.9898); // deterministic "random" spread
        const d = new THREE.Mesh(gypDot, gypMat);
        d.position.set(top.x + Math.cos(a) * sinT * r, top.y + cosT * r * 0.8, top.z + Math.sin(a) * sinT * r);
        g.add(d);
      }
      return g;
    }

    const HEADS = {
      rose: createRoseHead, lily: createLilyHead, sunflower: createSunflowerHead,
      tulip: createTulipHead, daisy: createDaisyHead, peony: createPeonyHead, hydrangea: createHydrangeaHead
    };
    const FILLERS = { eucalyptus: createEucalyptusSprig, lavender: createLavender, gypsophila: createGypsophila };

    // ---- Paper wrap (pleated kraft outside, tissue inside) + satin ribbon bow ----
    // Built once and added to the scene directly, so it isn't rebuilt when flowers change.
    const ribbonMat = new THREE.MeshStandardMaterial({ color: state.ribbon, roughness: 0.3, side: THREE.DoubleSide });
    const paperOuter = new THREE.MeshStandardMaterial({ color: state.wrap, roughness: 0.9, side: THREE.DoubleSide });
    const paperInner = new THREE.MeshStandardMaterial({ color: state.tissue, roughness: 0.85, side: THREE.DoubleSide });

    // Cone with sharp radial folds that deepen toward the open top, plus a ruffled rim.
    // (Old version: 28 segments for 14 pleats = 2 samples per fold, so the folds never showed.)
    function pleatedCone({ rTop, rBottom, height, pleats, depth, ruffle, ruffles }) {
      const g = new THREE.CylinderGeometry(rTop, rBottom, height, 144, 16, true);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const a = Math.atan2(z, x);
        const t = (y + height / 2) / height; // 0 = gathered bottom, 1 = open top
        const fold = Math.sin(a * pleats);
        const r = Math.hypot(x, z) + Math.sign(fold) * Math.pow(Math.abs(fold), 0.6) * depth * (0.2 + 0.8 * t);
        pos.setXYZ(i, Math.cos(a) * r, y + Math.cos(a * ruffles) * ruffle * t * t * t, Math.sin(a) * r);
      }
      g.computeVertexNormals();
      return g;
    }

    // Ribbon tail: hangs down, hugs the cone, swallow-tail notch at the end
    const tailGeom = (() => {
      const g = new THREE.PlaneGeometry(0.22, 0.95, 1, 10);
      g.translate(0, -0.475, 0);
      const p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i);
        p.setZ(i, y * 0.5 + Math.sin(y * 7) * 0.025);
        if (y < -0.94) p.setY(i, y + (0.11 - Math.abs(x)) * 0.9);
      }
      g.computeVertexNormals();
      return g;
    })();

    function createPleatedWrap() {
      const g = new THREE.Group();
      const inner = new THREE.Mesh(pleatedCone({ rTop: 1.5, rBottom: 0.2, height: 2.6, pleats: 15, depth: 0.07, ruffle: 0.14, ruffles: 9 }), paperInner);
      inner.position.y = -0.85;
      const outer = new THREE.Mesh(pleatedCone({ rTop: 1.58, rBottom: 0.28, height: 2.3, pleats: 9, depth: 0.12, ruffle: 0.2, ruffles: 5 }), paperOuter);
      outer.position.y = -1.0;
      g.add(inner, outer);

      // The old ribbon (radius 0.36) was buried inside the paper (radius ~0.7 at that height).
      // This band sits just outside the paper surface, with the bow on the +Z side.
      const bandY = -1.3, R = 0.92, bz = R + 0.04;
      const band = new THREE.Mesh(new THREE.TorusGeometry(R, 0.06, 8, 48), ribbonMat);
      band.rotation.x = Math.PI / 2;
      band.position.y = bandY;
      band.scale.z = 2.2; // stretch along the ring axis => a wide flat ribbon
      g.add(band);

      const knot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), ribbonMat);
      knot.scale.set(1, 0.9, 0.8);
      knot.position.set(0, bandY + 0.02, bz + 0.02);
      g.add(knot);

      for (const d of [-1, 1]) {
        const loop = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.07, 8, 24), ribbonMat);
        loop.scale.set(1.25, 0.8, 0.7);
        loop.position.set(d * 0.33, bandY + 0.04, bz + 0.02);
        loop.rotation.set(0.1, d * 0.45, d * 0.3);
        g.add(loop);

        const tail = new THREE.Mesh(tailGeom, ribbonMat);
        tail.position.set(d * 0.07, bandY - 0.04, bz);
        tail.rotation.z = d * 0.2;
        g.add(tail);
      }
      return g;
    }
    scene.add(createPleatedWrap());

    // Deterministic PRNG: same selection => same bouquet, so a shared link looks identical for the recipient
    function mulberry32(a) {
      return () => {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Per-build geometry/materials are disposed on rebuild (prevents GPU memory leaks); these are reused
    [leafGeom, roseInnerPetal, roseOuterPetal, lilyPetalGeom, sunRayGeom, tulipPetalGeom, stemMat].forEach(o => KEEP.add(o));
    function clearBouquet() {
      bouquetGroup.traverse(o => {
        if (o.geometry && !KEEP.has(o.geometry)) o.geometry.dispose();
        if (o.material && !KEEP.has(o.material)) o.material.dispose();
      });
      bouquetGroup.clear();
    }

    function buildBouquet() {
      clearBouquet();
      const rand = mulberry32(2024);

      const items = [];
      state.selected.forEach(type => {
        const count = FLOWER_TYPES[type].count;
        for (let i = 0; i < count; i++) items.push(type);
      });

      items.forEach((type, idx) => {
        const total = items.length;
        const frac = (idx + 0.5) / total;
        const angle = idx * 2.39996;
        const spread = 0.22 + Math.sqrt(frac) * 1.45;
        const height = 1.85 - frac * 0.65 + (rand() - 0.5) * 0.18;

        const tipPos = new THREE.Vector3(
          Math.cos(angle) * spread,
          height,
          Math.sin(angle) * spread
        );

        if (FILLERS[type]) {
          bouquetGroup.add(FILLERS[type](height, tipPos));
          return;
        }

        bouquetGroup.add(createStem(height, tipPos));
        const head = HEADS[type]();

        head.position.copy(tipPos);
        head.lookAt(tipPos.x * 2.4, tipPos.y + 1.6, tipPos.z * 2.4);
        bouquetGroup.add(head);
      });

    }

    // Floating ASCII sparkles
    const sparkleGroup = new THREE.Group();
    scene.add(sparkleGroup);
    const sparkleMat = new THREE.MeshBasicMaterial({ color: 0xfbcfe8 });
    const sparkleGeom = new THREE.OctahedronGeometry(0.045, 0);
    const sparkles = [];
    for (let i = 0; i < 18; i++) {
      const s = new THREE.Mesh(sparkleGeom, sparkleMat);
      s.position.set(
        (Math.random() - 0.5) * 6.5,
        (Math.random() - 0.5) * 5.5,
        (Math.random() - 0.5) * 6.5
      );
      s.userData.speed = 0.004 + Math.random() * 0.005;
      sparkleGroup.add(s);
      sparkles.push(s);
    }

    // UI Controls
    const flowerListEl = document.getElementById('flower-list');
    Object.entries(FLOWER_TYPES).forEach(([key, info]) => {
      const label = document.createElement('label');
      label.className = 'flower-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = state.selected.has(key);
      cb.addEventListener('change', () => {
        if (cb.checked) state.selected.add(key);
        else if (state.selected.size > 1) state.selected.delete(key);
        else cb.checked = true;
        buildBouquet();
        syncURL();
      });

      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = info.color;

      label.append(cb, swatch, document.createTextNode(info.label));
      flowerListEl.appendChild(label);
    });

    const ribbonInput = document.getElementById('ribbon-color');
    ribbonInput.value = state.ribbon;
    ribbonInput.addEventListener('input', e => {
      state.ribbon = e.target.value;
      ribbonMat.color.set(state.ribbon);
      syncURL();
    });

    const wrapInput = document.getElementById('wrap-color');
    wrapInput.value = state.wrap;
    wrapInput.addEventListener('input', e => {
      state.wrap = e.target.value;
      paperOuter.color.set(state.wrap);
      syncURL();
    });

    const tissueInput = document.getElementById('tissue-color');
    tissueInput.value = state.tissue;
    tissueInput.addEventListener('input', e => {
      state.tissue = e.target.value;
      paperInner.color.set(state.tissue);
      syncURL();
    });

    const noteInput = document.getElementById('note-input');
    const noteText = document.getElementById('note-text');
    noteInput.value = state.note;
    noteText.textContent = state.note;
    noteInput.addEventListener('input', e => {
      state.note = e.target.value;
      noteText.textContent = state.note;
      syncURL();
    });

    function syncURL() {
      const url = new URL(window.location);
      url.searchParams.set('flowers', Array.from(state.selected).join(','));
      url.searchParams.set('ribbon', state.ribbon);
      url.searchParams.set('wrap', state.wrap);
      url.searchParams.set('tissue', state.tissue);
      if (state.note) url.searchParams.set('note', state.note);
      else url.searchParams.delete('note');
      try { window.history.replaceState({}, '', url); } catch { /* e.g. file:// — address bar just won't update */ }
    }

    const copyBtn = document.getElementById('copy-link');
    copyBtn.addEventListener('click', async () => {
      let label = 'Link Copied!';
      try {
        await navigator.clipboard.writeText(window.location.href);
      } catch {
        label = 'Copy from address bar'; // clipboard API needs HTTPS + permission
      }
      copyBtn.textContent = label;
      setTimeout(() => (copyBtn.textContent = 'Copy Shareable Link'), 1800);
    });

    const panel = document.getElementById('control-panel');
    const toggleBtn = document.getElementById('toggle-ui');
    toggleBtn.addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      toggleBtn.textContent = panel.classList.contains('collapsed') ? 'Customize Bouquet' : 'Close';
    });

    buildBouquet();
    syncURL();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildEffect, 120);
    });

    // Cap at ~30fps: the ASCII pass rewrites a large DOM table every frame, and ASCII doesn't need 60fps
    const FRAME_MS = 1000 / 30;
    let last = 0;
    let slow = 0;
    function animate(now = 0) {
      requestAnimationFrame(animate);
      const elapsed = now - last;
      if (elapsed < FRAME_MS - 2) return;
      last = now;
      const dt = Math.min(elapsed / 16.7, 3); // keeps sparkle speed independent of frame rate
      controls.update();
      sparkles.forEach(s => {
        s.position.y += s.userData.speed * dt;
        s.rotation.y += 0.02 * dt;
        if (s.position.y > 3.2) s.position.y = -2.6;
      });
      const t0 = performance.now();
      effect.render(scene, camera);

      // Quality governor: if frames keep coming in slower than ~16fps (software WebGL, weak laptop,
      // huge monitor), shrink the ASCII grid by 30% and rebuild. Ignores long gaps from hidden tabs.
      const slowFrame = (elapsed > 60 && elapsed < 500) || performance.now() - t0 > 30;
      slow = slowFrame ? slow + 1 : Math.max(0, slow - 1);
      if (slow > 25 && maxCells > 3000) {
        maxCells = Math.max(3000, maxCells * 0.7);
        slow = 0;
        buildEffect();
      }
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
